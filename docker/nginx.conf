user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Uploads vidéo jusqu'à 512 Mo
    client_max_body_size    512M;
    client_body_timeout     300s;
    send_timeout            300s;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff font/woff2;

    # Buffers temporaires
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        add_header X-Frame-Options    "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff" always;

        charset utf-8;

        # Assets statiques avec cache long
        location ~* \.(css|js|woff2?|ttf|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files  $uri =404;
        }

        # Vidéos uploadées
        location ~* \.(mp4|webm|ogg|mov|avi)$ {
            expires    7d;
            add_header Cache-Control "public";
            try_files  $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass            127.0.0.1:9000;
            fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include                 fastcgi_params;
            fastcgi_hide_header     X-Powered-By;
            fastcgi_read_timeout    300s;
            fastcgi_send_timeout    300s;
            fastcgi_buffer_size     64k;
            fastcgi_buffers         16 64k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
